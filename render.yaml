# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shopify-ops-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render injects PORT itself; src/server.js reads it.
      # sync: false => Render prompts for these in the dashboard; values are never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
